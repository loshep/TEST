name: Actualización diaria y despliegue

on:
  schedule:
    - cron: '0 11 * * *'   # 11:00 UTC = 06:00 a. m. hora de Lima (UTC-5, sin horario de verano)
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['docs/**', 'scripts/**', '.github/workflows/**']

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Recopilar fuentes
        run: node scripts/update.mjs
      - name: Guardar historial en el repositorio
        run: |
          git config user.name "actualizacion-diaria"
          git config user.email "actions@users.noreply.github.com"
          git add docs/data
          git diff --cached --quiet || git commit -m "Actualización automática $(TZ=America/Lima date +'%Y-%m-%d %H:%M')"
          git push
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - id: deployment
        uses: actions/deploy-pages@v4
